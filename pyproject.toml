[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-cli"
version = "0.1.0"
description = "Minimal X/Twitter API v2 CLI — OAuth 1.0a, JSON output, unix-style"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jai Govindani" }]

dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "requests-oauthlib>=1.3",
]

[project.scripts]
tw = "tw_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
